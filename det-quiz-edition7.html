<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which DET member are you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #1E1B4B;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(15,157,139,0.35), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(244,114,63,0.28), transparent 38%),
      radial-gradient(circle at 85% 88%, rgba(124,58,237,0.35), transparent 42%),
      radial-gradient(circle at 10% 85%, rgba(15,157,139,0.22), transparent 40%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    color: #1a1a2e;
    overflow-x: hidden;
  }
  .stage {
    max-width: 540px;
    width: 100%;
    position: relative;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.06) inset;
    animation: cardIn 0.45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .badge-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
  }
  .header {
    background: linear-gradient(135deg, #3730A3 0%, #4C3EDB 100%);
    padding: 40px 32px 32px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    right: -30px;
    top: -30px;
    width: 130px;
    height: 130px;
    background: rgba(244,114,63,0.25);
    border-radius: 50%;
  }
  .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FF9E7A;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }
  .title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.15;
    position: relative;
    z-index: 1;
  }
  .body-pad {
    padding: 32px;
  }
  p.lead {
    font-size: 16px;
    line-height: 1.65;
    color: #33334d;
    margin-bottom: 14px;
  }
  .btn {
    background: #3730A3;
    color: #ffffff;
    border: none;
    padding: 14px 28px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 20px rgba(55,48,163,0.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(55,48,163,0.4); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-secondary {
    background: transparent;
    color: #3730A3;
    border: 2px solid #3730A3;
    box-shadow: none;
  }
  .progress-wrap {
    padding: 20px 32px 0;
  }
  .progress-track {
    height: 6px;
    background: #eeecf9;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #0F9D8B, #14C2A8);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: #8b8ba3;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .q-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #F0FBF8;
    color: #0F9D8B;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .q-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 22px;
    line-height: 1.3;
    color: #1a1a2e;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 15px 16px;
    margin-bottom: 10px;
    border: 2px solid #edecf7;
    border-radius: 14px;
    background: #fbfbfd;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #1a1a2e;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.12s ease;
  }
  .option:hover {
    border-color: #b8b3ec;
    background: #f6f5fc;
    transform: translateX(2px);
  }
  .option.selected {
    border-color: #0F9D8B;
    background: #f0fbf8;
  }
  .option-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #d8d6ea;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .option.selected .option-check {
    border-color: #0F9D8B;
    background: #0F9D8B;
  }
  .option.selected .option-check::after {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffffff;
  }
  .nav-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 22px;
  }
  .result-header {
    background: linear-gradient(135deg, #3730A3 0%, #4C3EDB 100%);
    padding: 44px 32px 90px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    top: -10px;
    border-radius: 2px;
    opacity: 0.9;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(240px) rotate(360deg); opacity: 0; }
  }
  .result-kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FF9E7A;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .result-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    position: relative;
    z-index: 1;
    line-height: 1.2;
  }
  .avatars {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-top: -64px;
    margin-bottom: 22px;
    position: relative;
    z-index: 2;
  }
  .avatar-block { text-align: center; }
  .avatar-ring {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: #ffffff;
    padding: 4px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    margin: 0 auto 12px;
  }
  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 3px solid #F0FBF8;
  }
  .avatar-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
  }
  .match-badge {
    display: inline-block;
    background: #F0FBF8;
    color: #0b7a6b;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 4px 12px;
    border-radius: 100px;
    margin-top: 6px;
  }
  .quote-box {
    background: #fbfbfd;
    border: 1px solid #edecf7;
    border-radius: 16px;
    padding: 20px 22px;
    font-size: 14px;
    line-height: 1.7;
    color: #33334d;
    text-align: center;
  }
  .quote-box div { margin-bottom: 6px; }
  .quote-box div:last-child { margin-bottom: 0; }
  .footer-actions {
    margin-top: 26px;
    display: flex;
    justify-content: center;
  }
  .fine-print {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-top: 18px;
    letter-spacing: 0.02em;
  }
  @media (max-width: 480px) {
    .header, .body-pad { padding-left: 24px; padding-right: 24px; }
    .progress-wrap { padding-left: 24px; padding-right: 24px; }
    .result-header { padding-left: 24px; padding-right: 24px; }
    .title { font-size: 27px; }
  }

  .podium-stage {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 16px;
    margin-top: -46px;
    position: relative;
    z-index: 2;
  }
  .pillar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 96px;
  }
  .pillar-col.rank-2 { order: 1; }
  .pillar-col.rank-1 { order: 2; }
  .pillar-col.rank-3 { order: 3; }
  .cluster-wrap {
    position: relative;
    height: 78px;
    width: 100%;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .cluster-avatar {
    position: absolute;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffffff;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    background: #ffffff;
    left: 50%;
    top: 50%;
  }
  .pillar {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  .pillar-cap {
    width: 84px;
    height: 8px;
    background: linear-gradient(180deg, #f1efe8, #d9d6cb);
    border-radius: 2px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.18);
    flex-shrink: 0;
  }
  .pillar-shaft {
    flex: 1;
    width: 64px;
    min-height: 30px;
    position: relative;
    background: linear-gradient(90deg, #efece3, #faf9f4 30%, #efece3 55%, #faf9f4 78%, #e8e5da);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }
  .pillar-plaque {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }
  .plaque-1 { background: #0F9D8B; }
  .plaque-2 { background: #3730A3; }
  .plaque-3 { background: #F4723F; }
  .podium-captions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
    margin-bottom: 20px;
  }
  .podium-caption {
    width: 96px;
    text-align: center;
  }
  .podium-caption.rank-2 { order: 1; }
  .podium-caption.rank-1 { order: 2; }
  .podium-caption.rank-3 { order: 3; }
  .podium-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #1a1a2e;
    line-height: 1.25;
  }
  .podium-name-1 { font-size: 15px; }
  .match-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 10px;
    border-radius: 100px;
    margin-top: 5px;
  }
  .match-badge-1 { background: #F0FBF8; color: #0b7a6b; }
  .match-badge-2 { background: #EEECF9; color: #3730A3; }
  .match-badge-3 { background: #FDEDE6; color: #b8471e; }
</style>
</head>

};

const QUIZ_DATA = {"team": ["Charlie", "Jason", "Andrew Z", "Tom", "Luke O", "Nik", "Andrew L"], "questions": ["Your spirit animal", "Your guilty pleasure movie", "Who at Zeelo would you want with you if stranded on a Desert Island?", "Favourite piece of tech you can't live without", "Your go-to karaoke song", "Your go-to coffee order", "Your favourite emoji to use", "Your dream office snack addition", "Your DET-themed pet name", "Your ideal Friday night, in 3 words"], "answers": [["Dog", "Wolf", "Manta Ray", "Slow Worm", "Cat", "Jaguar", "Penguin"], ["Happy Gilmore", "Parent Trap", "About Time", "Any Marvel Movie", "Love Actually", "Spirited Away", "How to Train Your Dragon"], ["George Grundy", "This feels political!", "Tim Flynn", "Nobody", "Andrew Z, as he could run 50km to find help", "Andrew Zhang", "Steven 🧠"], ["Kindle", "Airpods", "Smartwatch", "Kindle", "Claude Code", "iPhone", "Airpods"], ["N/A", "Living on a Prayer", "Mr. Brightside", "Grace Kelly - Mika", "Patience - Take That", "Lauryn Hill - Ex Factor", "Angels - Robbie Williams"], ["Filter Coffee Black", "Flat White", "Coffee Black", "Black Americano", "Oat Latte", "N/A - I don't drink coffee, not a hot drinks fan", "Iced Latte"], ["🧐", "🫡", "🔥", "👀", "😎", "👍 - best way to ragebait", "💅🏻"], ["I snack too much already", "Unsalted Mixed Nuts (This is a Giveaway!)", "Farm to Table Fruit Bowl", "Quavers (obviously)", "Oreos", "Kinder Bueno (White Choc)", "McFlurry Machine"], ["Token", "I don't understand this one!", "Put the D(ata) in DET", "ZACK (I am proud of him)", "Clawde", "Datamon", "PMOses"], ["Off My Phone!", "Bed by 10", "Books and Wine", "Not Going Outside", "Work Laptop Off 😁", "Food, TV & Chilling", "Cookies, Ice-Cream, Movie"]]};

const team = QUIZ_DATA.team;
const questions = QUIZ_DATA.questions;
const answers = QUIZ_DATA.answers;

let step = -1;
let picks = [];
let shuffledOrders = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function groupsForQuestion(q) {
  const opts = answers[q];
  const map = new Map();
  opts.forEach((text, idx) => {
    if (!map.has(text)) map.set(text, []);
    map.get(text).push(idx);
  });
  return Array.from(map.entries()).map(([text, indices]) => ({ text, indices }));
}

function buildShuffledOrders() {
  shuffledOrders = questions.map((_, q) => shuffle(groupsForQuestion(q)));
}

function computeRanking() {
  const scores = team.map(() => 0);
  picks.forEach((indices) => {
    if (!indices) return;
    indices.forEach((i) => scores[i]++);
  });
  const uniqueScores = Array.from(new Set(scores)).sort((a, b) => b - a);
  const tiers = uniqueScores.slice(0, 3).map((val) => ({
    score: val,
    members: team.filter((_, i) => scores[i] === val),
  }));
  return tiers;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function joinNames(names) {
  const escaped = names.map(escapeHtml);
  if (escaped.length === 1) return escaped[0];
  if (escaped.length === 2) return `${escaped[0]} and ${escaped[1]}`;
  return `${escaped.slice(0, -1).join(', ')} and ${escaped[escaped.length - 1]}`;
}

function renderConfetti() {
  const colors = ['#0F9D8B', '#F4723F', '#FFD166', '#7C3AED', '#ffffff'];
  let pieces = '';
  for (let i = 0; i < 26; i++) {
    const left = Math.random() * 100;
    const size = 5 + Math.random() * 6;
    const delay = Math.random() * 0.4;
    const duration = 1.4 + Math.random() * 1.1;
    const color = colors[i % colors.length];
    pieces += `<div class="confetti" style="left:${left}%; width:${size}px; height:${size * 0.6}px; background:${color}; animation-duration:${duration}s; animation-delay:${delay}s;"></div>`;
  }
  return pieces;
}

function clusterOffsets(count) {
  if (count === 1) return [[0, 0]];
  if (count === 2) return [[-19, 0], [19, 0]];
  if (count === 3) return [[0, -20], [-20, 12], [20, 12]];
  if (count === 4) return [[-19, -18], [19, -18], [-19, 18], [19, 18]];
  // 5+ : arrange in a centred wrap grid, roughly circular fallback
  const offsets = [];
  const radius = 22;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
    offsets.push([Math.cos(angle) * radius, Math.sin(angle) * radius * 0.7]);
  }
  return offsets;
}

function clusterHtml(members, avatarSize) {
  const offsets = clusterOffsets(members.length);
  const imgs = members.map((m, i) => {
    const [dx, dy] = offsets[i];
    return `<img class="cluster-avatar" style="width:${avatarSize}px;height:${avatarSize}px;margin-left:${-avatarSize / 2 + dx}px;margin-top:${-avatarSize / 2 + dy}px;" src="${PHOTOS[m]}" alt="${escapeHtml(m)}">`;
  }).join('');
  return `<div class="cluster-wrap">${imgs}</div>`;
}

function pillarHtml(rank, heightPx) {
  return `
    <div class="pillar" style="height:${heightPx}px;">
      <div class="pillar-cap"></div>
      <div class="pillar-shaft">
        <div class="pillar-plaque plaque-${rank}">${rank}</div>
      </div>
      <div class="pillar-cap"></div>
    </div>`;
}

function render() {
  const card = document.getElementById('quizCard');

  if (step === -1) {
    card.innerHTML = `
      <div class="header">
        <div class="kicker">The Dispatch presents</div>
        <div class="title">Which DET member are you?</div>
      </div>
      <div class="body-pad">
        <p class="lead">We asked the DET team 10 very important questions. Their answers say a lot.</p>
        <p class="lead">Answer the same ones and we will tell you which DET member you are secretly most like.</p>
        <button class="btn" onclick="startQuiz()">Start quiz</button>
      </div>`;
    return;
  }

  if (step < questions.length) {
    const order = shuffledOrders[step];
    const pct = (step / questions.length) * 100;
    card.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;"></div>
        </div>
        <div class="progress-meta">
          <span>Question ${step + 1} of ${questions.length}</span>
          <span>${Math.round(pct)}% there</span>
        </div>
      </div>
      <div class="body-pad">
        <div class="q-num">${step + 1}</div>
        <div class="q-title">${escapeHtml(questions[step])}</div>
        <div id="optionsWrap">
          ${order.map((group) => {
            const key = group.indices.join('_');
            return `
            <button class="option" data-key="${key}" onclick="selectOption('${key}')">
              <span class="option-check"></span>
              <span>${escapeHtml(group.text)}</span>
            </button>`;
          }).join('')}
        </div>
        <div class="nav-row">
          <button class="btn" id="nextBtn" disabled onclick="nextQuestion()">Next question</button>
        </div>
      </div>`;
    if (picks[step]) {
      const key = picks[step].join('_');
      selectOption(key);
    }
    return;
  }

  const tiers = computeRanking();
  const first = tiers[0];
  const second = tiers[1];
  const third = tiers[2];
  const isDraw = first.members.length > 1;

  const heights = { 1: 116, 2: 74, 3: 44 };
  const avatarSizes = { 1: 62, 2: 50, 3: 50 };

  const columns = [];
  if (second) columns.push({ rank: 2, tier: second });
  columns.push({ rank: 1, tier: first });
  if (third) columns.push({ rank: 3, tier: third });

  const stageHtml = columns.map(({ rank, tier }) => `
    <div class="pillar-col rank-${rank}">
      ${clusterHtml(tier.members, avatarSizes[rank])}
      ${pillarHtml(rank, heights[rank])}
    </div>`).join('');

  const captionsHtml = columns.map(({ rank, tier }) => `
    <div class="podium-caption rank-${rank}">
      <div class="podium-name ${rank === 1 ? 'podium-name-1' : ''}">${tier.members.map(escapeHtml).join(' & ')}</div>
      <div class="match-badge match-badge-${rank}">${Math.round((tier.score / questions.length) * 100)}% match</div>
    </div>`).join('');

  card.innerHTML = `
    <div class="result-header">
      ${renderConfetti()}
      <div class="result-kicker">Results are in</div>
      <div class="result-title">${isDraw ? "It's a draw" : "You are most like"}</div>
    </div>
    <div class="body-pad" style="padding-top: 0;">
      <div class="podium-stage">${stageHtml}</div>
      <div class="podium-captions">${captionsHtml}</div>
      <div class="quote-box">
        <div>Let ${joinNames(first.members)} know you've picked them, or don't if you think they'll be worried.</div>
      </div>
      <div class="footer-actions">
        <button class="btn btn-secondary" onclick="restartQuiz()">Take it again</button>
      </div>
    </div>`;
}

function startQuiz() {
  buildShuffledOrders();
  step = 0;
  render();
}

function selectOption(key) {
  const indices = key.split('_').map(Number);
  picks[step] = indices;
  document.querySelectorAll('.option').forEach((el) => el.classList.remove('selected'));
  const target = document.querySelector(`.option[data-key="${key}"]`);
  if (target) target.classList.add('selected');
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.disabled = false;
}

function nextQuestion() {
  step++;
  render();
}

function restartQuiz() {
  step = -1;
  picks = [];
  shuffledOrders = [];
  render();
}

render();
</script>
